[project]
name = "astroflow"
version = "0.1.0"
description = "Pipeline de dados com APIs da NASA uv sync"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "requests>=2.32",
    "python-dotenv>=1.0",
    "tenacity>=9.0",
    "psycopg[binary]>=3.2",
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pytest-cov",
    "pre-commit",
    "pip-audit",
    "ipykernel",
    "jupyter",
    "matplotlib",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astroflow"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # estilo (pycodestyle)
    "F",        # erros (pyflakes)
    "I",        # ordenação de imports
    "B",        # bugs comuns (bugbear)
    "UP",       # sintaxe moderna do Python
]
ignore = ["E741"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
